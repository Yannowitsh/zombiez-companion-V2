name = "zombiezcompanion-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Keep the workers.dev route LIVE alongside the custom domain — old clients (<=1.9.1) still call it.
# Adding any route makes wrangler disable workers.dev unless this is set explicitly. Only flip to false
# once <=1.9.1 clients have aged out (then all traffic flows through the WAF-protected custom domain).
workers_dev = true

# Custom domain (zone yannowitsh.dev, Cloudflare-managed). Adds zombiez.yannowitsh.dev pointing to this
# Worker (DNS + cert auto-provisioned) WITHOUT disabling the workers.dev route — both stay live during
# the rollout while old clients (<=1.9.1, which call the workers.dev URL) age out. Once adoption is high:
# add zone rate-limiting + WAF rules on this hostname, then disable the workers.dev route.
[[routes]]
pattern = "zombiez.yannowitsh.dev"
custom_domain = true

# KV storage. Create it once with:
#   wrangler kv namespace create ZZC
# then paste the printed id below.
[[kv_namespaces]]
binding = "ZZC"
id = "18d37de7288747eb805295edb4eb847f"

# Per-IP rate limiting at the edge (free, does not consume KV). Guards against request floods
# ("denial of wallet"). namespace_id is any unique number per binding; period is 10 or 60 (seconds).
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Stricter limiter for feedback specifically, to prevent Discord webhook spam.
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Writes are the costly path (each POST can be a KV write at ~$5/M). Two extra guards on POSTs:
#  - WRITE_LIMITER: per-IP, tighter than the global 300/min (a legit client writes presence a
#    few times/min + the occasional friend/ping/spawn — 120/min is generous, floods get 429'd).
#  - WRITE_GLOBAL_LIMITER: a single constant key => an aggregate ceiling on total writes/min, so a
#    DISTRIBUTED flood (many IPs each under the per-IP cap) still can't blow up the KV bill. NB the
#    rate-limit binding counts per-colo, so this bounds each data center, not a hard global count —
#    good enough as a wallet guard; a Durable Object counter would make it strictly global later.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "WRITE_GLOBAL_LIMITER"
namespace_id = "1004"
simple = { limit = 2000, period = 60 }

# Every 3 min: refresh the "who's online" roster message in Discord (scheduled handler). Was every
# minute; the roster doesn't need per-minute accuracy and each run does a KV list() + per-key get()
# fan-out (see updateRoster) that isn't covered by the /presence edge cache.
[triggers]
crons = ["*/3 * * * *"]

# Realtime hub: a single Durable Object holds every client's WebSocket for instant push
# (broadcast toasts + group pings). Requires the Workers paid plan? -> SQLite-backed DOs are
# available on the free plan (with limits); verify billing before first deploy.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Update these on each mod release to drive the in-game update notification.
[vars]
# Hard daily write budget (self-imposed wallet cap on KV writes; enforced globally by the Hub DO's
# charge()). Well above legit peak (~a few k/day at 3-5 players, ~<50k on a very busy 20-player day),
# so real players never hit it. Check today's usage at GET /budget and lower this once you see reality.
WRITE_BUDGET_DAILY = "100000"
LATEST_VERSION = "1.0.2"
DOWNLOAD_URL = "https://github.com/Yannowitsh/zombiez-companion-V2/releases"
# Discord slash-command verification. DISCORD_PUBLIC_KEY = your app's public key (portal ->
# General Information). DISCORD_ADMIN_IDS = optional comma-separated Discord user ids allowed to
# run /broadcast (empty = anyone who can see the command). Both safe as plaintext vars (public key
# is not secret; the bot token used to *register* the command stays out of the repo).
DISCORD_PUBLIC_KEY = "9633c1de67af4457802153d7f34bfb1a98132bb63fe6afd8969c3e96ec911f65"
DISCORD_ADMIN_IDS = "236894641138565123"
